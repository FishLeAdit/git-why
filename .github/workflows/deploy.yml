# Build the static site and publish it to GitHub Pages on every push to main.
# public/data/ (the search index) is committed, so this needs no GitHub token or fetch step.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a newer push cancels a queued (not running) one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # onnxruntime-node is only used by `npm run index` locally; skip its binary download hook.
      - run: npm ci
        env:
          ONNXRUNTIME_NODE_INSTALL: skip
      # vite.config.ts reads GITHUB_REPOSITORY to set the /<repo>/ base path.
      - run: npm run build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
